_base_:
  - ../models/openrsd_baseline.yaml
  - ../datasets/dota_v1_train.yaml
  - ../datasets/dota_v1_val.yaml

experiment:
  name: dota_v1_baseline
  seed: 7
  epochs: 12
  batch_size: 2
  learning_rate: 0.0002
  weight_decay: 0.0001
  device: cuda
  taxonomy_path: assets/hierarchies/remote_sensing_taxonomy.json
  prompt_template_path: assets/prompts/prompt_templates.json
  output_dir: outputs/dota_v1_baseline
